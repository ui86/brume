name: Release Rust Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and test
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release --target ${{ matrix.target }}
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true
      - name: Compress and verify binary
        run: |
          binary="target/${{ matrix.target }}/release/brume"
          upx --best "$binary"
          upx -t "$binary"
          "$binary" --help | grep -F -- --dns-servers
      - name: Package release asset
        run: |
          tar -czf "brume-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" brume -C "$GITHUB_WORKSPACE" README.md docs
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "brume-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.tar.gz" --clobber
  clean-old-workflows:
    name: Clean Old Workflows and Releases
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 2
          keep_minimum_runs: 0
      - name: Delete Old Releases
        uses: ui86/delete-older-releases@v1
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
