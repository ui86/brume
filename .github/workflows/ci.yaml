name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Check installer
        run: |
          bash -n install.sh
          bash -n install-local.sh
          for test_script in tests/*.bash; do
            case "$test_script" in tests/linux_*) continue ;; esac
            bash "$test_script"
          done
  linux-integration:
    name: Linux resource and firewall integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install isolated firewall test tools
        run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2
      - run: cargo build --locked
      - name: Verify descriptor exhaustion and recovery
        run: python3 tests/linux_resources.py target/debug/brume
      - name: Verify firewall rules in an isolated network namespace
        run: sudo unshare --net bash tests/linux_firewall.bash
      - name: Verify temporary systemd service and transaction recovery
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            BRUME_CI_SYSTEMD=1 bash tests/linux_systemd.bash "$PWD/target/debug/brume"
      - name: Verify installation in containers without an init system
        run: |
          docker run --rm --cap-drop NET_ADMIN --tmpfs /tmp:rw,noexec -v "$PWD:/repo:ro" debian:bookworm-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd nftables iptables
            bash /repo/tests/linux_container.bash debian
            BRUME_LOCAL_CONTAINER=1 TMPDIR=/root bash /repo/tests/local_install.bash
          '
          docker run --rm --cap-drop NET_ADMIN --tmpfs /tmp:rw,noexec -v "$PWD:/repo:ro" alpine:3.23 sh -ec '
            apk add --no-cache bash openrc nftables iptables flock
            bash /repo/tests/linux_container.bash alpine
            BRUME_LOCAL_CONTAINER=1 TMPDIR=/root bash /repo/tests/local_install.bash
          '
