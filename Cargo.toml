[package]
name = "brume"
version = "1.0.7"
edition = "2024"
description = "轻量级 SOCKS5 代理服务器"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"

[features]
performance-bench = []

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "benchmarks"
harness = false
required-features = ["performance-bench"]
